server {
    listen 80;
    server_name few-ai.top;

    root /var/www/few-ai.com;
    index index.html;

    # 统一安全头（对所有 location 生效）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip（如已在 http{} 开启，可删除这里重复设置）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 特定路径处理 - poster 目录
    location /poster/ {
        try_files $uri $uri/ /index.html;
        add_header X-Debug-Location "poster-directory" always;
    }

    # SPA 路由 - 处理所有其他路径
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Debug-Location "spa-fallback" always;
    }

    # 隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 备份文件（以 ~ 结尾）
    location ~ \~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 错误页（可选，建议保留真实状态）
    error_page 404 =200 /index.html;
    # 或者直接删除这一行，仅靠 try_files 即可

    # 日志
    access_log /var/log/nginx/few-ai.com/access.log;
    error_log  /var/log/nginx/few-ai.com/error.log;
}
